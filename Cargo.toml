[workspace]
members = [
    "crates/cosmarden-core",
    "crates/cosmarden-agent",
    "crates/cosmarden-ui",
    "crates/cosmarden-cli",
    "crates/cosmarden-tests",
]
resolver = "3"

# Treat compiler warnings as build errors across all first-party crates. Applies
# to every `cargo build/check/test` (each member opts in via `[lints] workspace =
# true`). Git/registry dependencies (e.g. libcosmic) are automatically lint-capped
# by Cargo, so this only gates our own code. Keep the tree warning-clean; if a
# warning is genuinely unavoidable, use a narrowly-scoped `#[allow(...)]` with a
# comment rather than relaxing this.
[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
anyhow = "1.0.102"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49.0" }
rustix = { version = "1.1", features = ["process", "mm"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
postcard = { version = "1.0", features = ["alloc"] }
zeroize = { version = "1.8", features = ["derive"] }
# Bare URL (rides master, pinned to an exact commit by Cargo.lock) rather than
# `rev = "…"`: cosmic-panel-config's transitive cosmic-config dep uses the bare
# URL too, and Cargo treats bare/`?branch=`/`?rev=` as distinct sources — any
# qualifier on our side double-compiles 5 libcosmic crates. The alternative is
# pinning a rev here for fully controlled bumps, at the cost of that duplicate
# compilation; we chose the unified graph instead.
#
# The lock deliberately holds 53314201b (2026-09-11), the COSMIC 1.8-era commit
# that is the master tip's parent, not the tip itself: the tip's "chore: update
# iced" commit moves the bundled iced submodule's cosmic-client-toolkit pin to
# rev c0cff4d while libcosmic's own Cargo.toml still pins rev 32283d7, so that
# one commit resolves two cosmic-protocols sources into the graph. A [patch]
# cannot repair it — Cargo rejects a same-URL patch ("patches must point to
# different sources") and silently ignores a rev-qualified key — so the pin is
# the only way to keep one instance per dependency. 53314201b carries the same
# iced and cosmic-protocols revisions the workspace had on 2026-08-24.
libcosmic = { git = "https://github.com/pop-os/libcosmic" }
cosmic-config = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["macro"] }
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = "8.11.0"
rsa = "0.9.9"
sha1 = "0.10.6"
sha2 = "0.10.9"
rand = "0.9"
zbus = { version = "5.14.0", default-features = false, features = ["tokio"] }

# `cargo build --release` and `cargo bloat` fail with "cannot prefer dynamic
# linking when performing LTO" unless RUSTFLAGS is set, because
# .cargo/config.toml's `build.rustflags` sets `-C prefer-dynamic`, which is
# incompatible with any non-"off" `lto` setting below. `just build` already
# works around this: its `RUSTFLAGS="-C target-cpu=native"` env var fully
# REPLACES (not merges with) config.toml's rustflags, dropping
# `prefer-dynamic`. Don't "fix" `just build` by removing that env var.
[profile.release]
opt-level = "z"     # Optimize for size
lto = "fat"         # Enable full LTO for maximal cross-crate optimization
codegen-units = 1   # Maximize optimization potential
strip = true        # Automatically strip symbols from the binary
incremental = false # Disable incremental compilation for release
# `panic` is intentionally left at the default ("unwind"), not "abort":
# the agent is a long-running daemon holding decrypted vault secrets in
# memory-locked, Zeroize-on-Drop buffers (see core/src/locked.rs). Under
# "abort", any panic in a per-connection handler kills the whole daemon
# without running Drop/zeroize, dropping every client's session and leaving
# secrets unzeroized. Under "unwind", a panic only unwinds (and zeroizes)
# the task that panicked. The binary-size win from "abort" (~5-10% of an
# already ~6-7MB stripped, fat-LTO binary) isn't worth that regression.
