<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="app">
        <div id="header">
            <button id="back-btn" class="hidden">←</button>
            <input type="text" id="search" placeholder="Search vault..." autofocus>
            <button id="add-btn" title="Add Entry">+</button>
            <button id="sync-btn" title="Sync Vault">🔄</button>
        </div>
        
        <div id="status">Loading...</div>

        <!-- View: List -->
        <div id="view-list" class="hidden">
            <div id="results">
                <!-- Results will be injected here -->
            </div>
        </div>

        <!-- View: Detail -->
        <div id="view-detail" class="hidden">
            <div id="detail-content"></div>
            <div class="view-actions">
                <button id="edit-btn">Edit</button>
                <button id="delete-btn" class="danger">Delete</button>
            </div>
        </div>

        <!-- View: Edit/Add -->
        <div id="view-edit" class="hidden">
            <form id="edit-form">
                <div class="form-group">
                    <label for="edit-type">Type</label>
                    <select id="edit-type">
                        <option value="Login">Login</option>
                        <option value="Card">Card</option>
                        <option value="Identity">Identity</option>
                        <option value="SecureNote">Secure Note</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-name">Name</label>
                    <input type="text" id="edit-name" required>
                </div>
                
                <!-- Dynamic fields will be injected here -->
                <div id="dynamic-fields"></div>

                <div class="form-group">
                    <label for="edit-notes">Notes</label>
                    <textarea id="edit-notes"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" id="save-btn">Save</button>
                    <button type="button" id="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>

        <div id="footer">
            <button id="lock-btn">Lock Vault</button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
