<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="app">
        <div id="header">
            <button id="back-btn" class="hidden" title="Back">←</button>
            <input type="text" id="search" placeholder="Search vault..." autofocus>
            <button id="fav-btn" title="Show favourites only">☆</button>
            <button id="add-btn" title="Add Entry">+</button>
            <button id="sync-btn" title="Sync Vault">⟳</button>
            <button id="lock-btn" title="Lock Vault">🔒</button>
        </div>

        <div id="status" class="hidden"></div>

        <!-- View: Locked (PIN unlock) -->
        <div id="view-locked" class="hidden">
            <div id="locked-message" class="locked-message"></div>
            <div id="locked-pin-group" class="hidden">
                <input type="password" id="locked-pin-input" placeholder="PIN" inputmode="numeric" autocomplete="off">
                <button id="locked-unlock-btn">Unlock</button>
            </div>
            <div id="locked-feedback" class="hidden"></div>
            <button id="locked-fallback-btn" class="hidden">Use master password instead</button>
        </div>

        <!-- View: List -->
        <div id="view-list" class="hidden">
            <div id="results"></div>
        </div>

        <!-- View: Detail -->
        <div id="view-detail" class="hidden">
            <div id="detail-content"></div>
            <div class="view-actions">
                <button id="edit-btn">Edit</button>
                <button id="delete-btn" class="danger">Delete</button>
            </div>
        </div>

        <!-- View: Edit/Add -->
        <div id="view-edit" class="hidden">
            <form id="edit-form">
                <div class="form-group">
                    <label for="edit-type">Type</label>
                    <select id="edit-type">
                        <option value="Login">Login</option>
                        <option value="Card">Card</option>
                        <option value="Identity">Identity</option>
                        <option value="SecureNote">Secure Note</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-name">Name</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div id="dynamic-fields"></div>
                <div class="form-group">
                    <label for="edit-notes">Notes</label>
                    <textarea id="edit-notes"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" id="save-btn">Save</button>
                    <button type="button" id="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <!-- popup-lock.js loads first: popup.js's init IIFE awaits browser.tabs.query
         and may call showLockedView() from a microtask that fires before the
         parser reaches a later <script> tag, so anything popup.js can call
         during init must already be defined. -->
    <script src="popup-lock.js"></script>
    <script src="popup.js"></script>
    <script src="popup-detail.js"></script>
    <script src="popup-edit.js"></script>
</body>
</html>
