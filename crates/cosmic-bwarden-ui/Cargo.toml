[package]
name = "cosmic-bwarden-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Don Enikeev <donat@enikeev.net>"]
description = "CosmicBWarden UI"

[[bin]]
name = "cosmic-applet-bwarden"
path = "src/main.rs"

# `cargo deb -p cosmic-bwarden-ui --no-build` packages the whole app (all three
# release binaries + desktop entry + applet metadata + hardened systemd user
# unit + icons). Build the workspace release binaries first (`just build`).
# NOTE for Debian-host finalization: `depends` is a conservative manual list —
# $auto needs dpkg tooling, absent on non-Debian dev machines. Verify with
# `dpkg-shlibdeps` on a real Debian/Ubuntu host before publishing.
[package.metadata.deb]
name = "cosmic-bwarden"
maintainer = "Don Enikeev <donat@enikeev.net>"
copyright = "2026, Donat Enikeev"
extended-description = """\
Native Bitwarden/Vaultwarden client for the COSMIC desktop: background agent \
holding the vault in memory-locked storage, panel applet, CLI, SSH agent, and \
browser-extension native host."""
depends = "libc6, libxkbcommon0, libwayland-client0, libwayland-egl1, libegl1"
section = "utils"
priority = "optional"
assets = [
    ["../../target/release/cosmic-bwarden-agent", "usr/bin/", "755"],
    ["../../target/release/cosmic-applet-bwarden", "usr/bin/", "755"],
    ["../../target/release/cosmic-bwarden-cli", "usr/bin/", "755"],
    ["resources/com.enikeev.cosmic_bwarden.desktop", "usr/share/applications/", "644"],
    ["../../packaging/com.enikeev.cosmic_bwarden.ron", "usr/share/cosmic/applets/", "644"],
    ["../../packaging/cosmic-bwarden-agent.deb.service", "usr/lib/systemd/user/cosmic-bwarden-agent.service", "644"],
    # Mirrors `just install`'s hicolor layout (docs/cosmic_integration.md).
    # There is no dark-theme variant of the plain app icon: Linux desktops
    # don't swap a hicolor app icon by system theme (verified against
    # cosmic-settings/toot in tmp_code_examples — every COSMIC app ships
    # exactly one). The `-symbolic` sibling below is the one icon a
    # theme-aware consumer (e.g. app-icon pickers, the panel button we
    # already render this way) can actually auto-recolor.
    ["../../icons/black.svg", "usr/share/icons/hicolor/scalable/apps/com.enikeev.cosmic_bwarden.svg", "644"],
    ["../../icons/black16.png", "usr/share/icons/hicolor/16x16/apps/com.enikeev.cosmic_bwarden.png", "644"],
    ["../../icons/black32.png", "usr/share/icons/hicolor/32x32/apps/com.enikeev.cosmic_bwarden.png", "644"],
    ["../../icons/black64.png", "usr/share/icons/hicolor/64x64/apps/com.enikeev.cosmic_bwarden.png", "644"],
    ["../../icons/black128.png", "usr/share/icons/hicolor/128x128/apps/com.enikeev.cosmic_bwarden.png", "644"],
    ["resources/icons/cosmic-bwarden-symbolic.svg", "usr/share/icons/hicolor/scalable/apps/com.enikeev.cosmic_bwarden-symbolic.svg", "644"],
]

[dependencies]
cosmic-bwarden-core = { path = "../cosmic-bwarden-core" }
anyhow = { workspace = true }
libcosmic = { workspace = true, features = ["applet", "applet-token", "process", "single-instance"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
serde = { workspace = true }
postcard = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = { workspace = true }
async-stream = "0.3"
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
tracing-journald = "0.3"
i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
rust-embed = { workspace = true }
zeroize = { workspace = true }

[features]
default = ["public_suffix_list"]
# PSL-backed eTLD+1 extraction for applet row labels (e.g. shows
# "example.co.uk", not "co.uk"). Without it labels fall back to the full
# host, never a naive last-two-labels cut. See docs/public_suffix_list.md.
public_suffix_list = ["cosmic-bwarden-core/public_suffix_list"]

[lints]
workspace = true
