[package]
name = "cosmic-bwarden-ui"
version = "0.1.0"
edition = "2021"
description = "CosmicBWarden UI"

[[bin]]
name = "cosmic-applet-bwarden"
path = "src/main.rs"

[dependencies]
cosmic-bwarden-core = { path = "../cosmic-bwarden-core" }
anyhow = { workspace = true }
libcosmic = { workspace = true, features = ["applet", "applet-token", "process", "single-instance"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
serde = { workspace = true }
postcard = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = { workspace = true }
async-stream = "0.3"
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
tracing-journald = "0.3"
i18n-embed = { workspace = true }
i18n-embed-fl = { workspace = true }
rust-embed = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
