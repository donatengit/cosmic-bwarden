[package]
name = "cosmarden-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Don Enikeev <donat@enikeev.net>"]
repository = "https://github.com/donatengit/cosmic-bwarden"
homepage = "https://github.com/donatengit/cosmic-bwarden"
description = "Command-line client for the cosmarden agent"

[[bin]]
name = "cosmarden"
path = "src/main.rs"

[dependencies]
cosmarden-core = { path = "../cosmarden-core" }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
anyhow = { workspace = true }
rpassword = "7.3"

[lints]
workspace = true
