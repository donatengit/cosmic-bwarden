[package]
name = "cosmic-bwarden-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Don Enikeev <donat@enikeev.net>"]

[dependencies]
aes = "0.8.4"
anyhow = { workspace = true }
argon2 = "0.5.3"
arrayvec = "0.7.6"
base64 = "0.22.1"
block-padding = "0.3.3"
cbc = { version = "0.1.2", features = ["alloc", "std"] }
directories = "6.0"
hkdf = "0.12.4"
log = { workspace = true }
hmac = { version = "0.12.1", features = ["std"] }
pbkdf2 = "0.12.2"
percent-encoding = "2.3"
pkcs8 = "0.10.2"
psl = { version = "2.1", optional = true }
rand = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rsa = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { version = "0.1", optional = true }
serde_repr = "0.1"
postcard = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
thiserror = "2.0"
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "io-util", "fs"] }
cosmic-config = { workspace = true }
url = "2.5"
uuid = { version = "1.0", features = ["v4"] }
zeroize = { workspace = true }

[features]
default = []
# Reports the exact JSON path of deserialization errors via
# `serde_path_to_error`, at the cost of ~80KB of .text in release builds.
# Useful when debugging Bitwarden API response drift; not needed in
# production builds.
debug-api = ["dep:serde_path_to_error"]
# Public Suffix List-backed registrable-domain (eTLD+1) rule in
# `domain::hosts_match`. The `psl` crate compiles the list into the binary
# (+~800KB .text, no heap, no runtime fetch). Without this feature matching
# degrades gracefully to the exact + label-boundary subdomain rules (sibling
# subdomains like accounts.google.com vs mail.google.com stop matching).
# See docs/public_suffix_list.md for the full rationale.
public_suffix_list = ["dep:psl"]

[lints]
workspace = true
