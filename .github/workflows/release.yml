# Release automation: pushing a tag `vYYYY.MM.P` builds the .deb and the
# browser-extension zip, signs the extension on AMO's unlisted channel, and
# attaches everything to a draft GitHub release.
# Versioning decision: docs/review/07_packaging.md — release tags are
# calendar-based YYYY.MM.PATCH; the seconds-based build version stays a
# build-info string only, and protocol compatibility rides the independent
# core::PROTOCOL_VERSION constant.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps (libcosmic)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev \
            pkg-config cmake libssl-dev libtss2-dev zip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        # Empty RUSTFLAGS drops .cargo/config.toml's prefer-dynamic (conflicts
        # with fat LTO); no target-cpu=native for distributable artifacts.
        # The KDE artifacts build here too: the applet with the `kde` feature
        # (libcosmic's missing-COSMIC-session log noise demoted) and the
        # Plasma tray, which is a non-default workspace member that a plain
        # `cargo build --release` skips. The .deb ships both.
        run: |
          RUSTFLAGS="" cargo build --release --features cosmarden-ui/kde
          RUSTFLAGS="" cargo build --release -p cosmarden-plasma-tray
      - name: Build .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p cosmarden-ui --no-build
      - name: Pack browser extension
        # Same script CI runs on every push — never inline the zip here again:
        # the previous inline copy had drifted and shipped package.json.
        run: packaging/pack-extension.sh
      - name: Draft release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/debian/*.deb
            target/cosmarden-extension.zip

  # Signs the extension on AMO's unlisted channel via the same single-entry
  # pipeline a maintainer runs locally (`just sign-extension` with
  # EXT_SIGN_MODE=release) and attaches the signed XPI to the draft release
  # above, plus a workflow artifact copy.
  #
  # Required repository SECRETS (env-only; the pipeline never puts them on a
  # command line): WEB_EXT_API_KEY, WEB_EXT_API_SECRET — generated at
  # https://addons.mozilla.org/developers/addon/api/key/.
  #
  # Update hosting: defaults to this repo's GitHub Releases. update_url is
  # baked into the XPI as .../releases/latest/download/updates.json (a stable
  # always-current manifest location — note releases/latest only resolves once
  # the draft release is PUBLISHED, which is the go-live step); update_link
  # entries are tag-scoped (.../releases/download/<tag>/...) so each hash
  # always describes the exact immutable file Firefox downloads. Repository
  # VARIABLE EXT_UPDATE_BASE_URL overrides the base for non-GitHub hosting
  # (e.g. https://updates.example.com/cosmarden).
  #
  # Release-mode signing is strict: the tag must be vYYYY.MM.P[-alphaN] and
  # the tree clean. The tag IS the version — it is injected into the staged manifest at
  # sign time, so browser-extension/manifest.json needs no release bumps (its
  # committed version only matters for manual store uploads via the packed
  # zip). A failed preflight uploads nothing to AMO, so it consumes no
  # version.
  sign-extension:
    needs: artifacts
    runs-on: ubuntu-latest
    # Must exceed EXT_SIGN_TIMEOUT_MS: the AMO approval poll can outlast
    # web-ext's own default (15 min). A 30-minute window already failed once
    # (2026-09-23) with the submission uploaded and still unreviewed.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Install just
        run: |
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch the published updates.json (preserve prior release entries)
        env:
          EXT_UPDATE_BASE_URL: ${{ vars.EXT_UPDATE_BASE_URL || format('https://github.com/{0}/releases/latest/download', github.repository) }}
        run: |
          mkdir -p dist
          curl -fsSL --retry 3 "$EXT_UPDATE_BASE_URL/updates.json" -o dist/updates.json \
            || { echo "first release — no published updates.json yet"; rm -f dist/updates.json; }
      - name: Sign extension on AMO (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          EXT_UPDATE_BASE_URL: ${{ vars.EXT_UPDATE_BASE_URL || format('https://github.com/{0}/releases/latest/download', github.repository) }}
          EXT_UPDATE_LINK_BASE: ${{ format('https://github.com/{0}/releases/download/{1}', github.repository, github.ref_name) }}
          EXT_SIGN_MODE: release
          # 60 minutes for the AMO approval poll. web-ext's 15-minute default
          # and the previous 30-minute window both proved too short when AMO's
          # review queue is slow; the submission stays pending, so timing out
          # only wastes the wait and leaves the version unsigned.
          EXT_SIGN_TIMEOUT_MS: 3600000
        run: just sign-extension
      - name: Upload signed XPI as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmarden-signed-xpi
          path: |
            dist/*.xpi
            dist/updates.json
          if-no-files-found: error
      - name: Attach signed XPI to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/cosmarden-*.xpi --clobber
          # Stable "latest build" copy for manual downloads:
          # .../releases/latest/download/cosmarden-firefox.xpi
          cp dist/cosmarden-*.xpi dist/cosmarden-firefox.xpi
          gh release upload "${GITHUB_REF_NAME}" dist/cosmarden-firefox.xpi --clobber
          if [ -f dist/updates.json ]; then
            gh release upload "${GITHUB_REF_NAME}" dist/updates.json --clobber
          fi
