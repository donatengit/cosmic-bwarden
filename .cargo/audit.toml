# cargo-audit configuration — read by `cargo audit` locally and in CI.
#
# Every entry below is an advisory with NO upgrade available to this workspace:
# either upstream has published no patched release, or the patched release is
# unreachable because a dependency we don't control pins the old major. Each
# one records why it is not exploitable here, and what would change that.
#
# Rules for this file:
#   - An ignore is a claim about reachability. Verify it with
#     `cargo tree -p <shipped-crate> -e normal -i <crate>` before adding one.
#   - Re-check the list whenever dependencies move; drop the entry the moment a
#     patched version becomes reachable. A stale ignore is worse than no audit.
#   - Never add an advisory that is reachable from cosmarden-agent,
#     -ui, or -cli at runtime without an explicit written risk acceptance.

[advisories]
ignore = [
    # --- Reachable in shipped binaries: accepted risk, documented ---------

    # RUSTSEC-2023-0071 — rsa 0.9.x, "Marvin Attack": timing sidechannel in
    # PKCS#1 v1.5 decryption that can leak key material to an attacker who can
    # submit many chosen ciphertexts AND measure decryption timing precisely.
    # No fixed release exists in the rsa 0.9 line; the RustCrypto fix is not
    # published, and every Rust Bitwarden client (including rbw) is in the same
    # position. Reachable here: core's RSA-OAEP unwrap of the user's private
    # key/org keys, and ssh-key via ssh-agent-lib.
    # Why accepted: decryption runs locally in the agent on data already held
    # by the vault owner; there is no network-facing decryption oracle. An
    # attacker would need a compromised/hostile server feeding chosen
    # ciphertexts *and* a local timing channel against the agent — and a local
    # observer of that fidelity is already inside the same-UID trust boundary
    # documented in SECURITY.md. Tracked in docs/roadmap.md; the moment rsa
    # ships a fixed release this entry must go.
    "RUSTSEC-2023-0071",

    # --- Linked, but no affected operation is invoked ----------------------

    # RUSTSEC-2026-0387 — crypto-bigint 0.5.5 constant-time failures: timing
    # leakage from subtraction, zero counting, division, Montgomery
    # multiplication, `UintRef` equality and `invert`. The fix is in 0.7.6,
    # reachable only through elliptic-curve 0.14 (p256 0.14), which ssh-key
    # 0.6.7 does not use. ssh-key 0.7 is still a release candidate, and
    # ssh-agent-lib 0.6.0 (the latest) still pins ssh-key 0.6 with the `crypto`
    # feature that pulls p256/p384/p521 into the graph.
    #
    # Reachability: crypto-bigint arrives only as
    #   ssh-key -> p256/p384/p521 -> elliptic-curve -> crypto-bigint
    # Our agent signs only Ed25519 (ed25519-dalek) and RSA (the rsa crate,
    # which uses num-bigint-dig, not crypto-bigint); every other key type
    # returns "unsupported key type" before signature arithmetic
    # (`ssh_agent/sign.rs`), and the identity list is built from the stored
    # public-key text, never from private-key arithmetic
    # (`ssh_agent/identities.rs`). No affected operation runs on a secret
    # integer here. Verified with
    #   cargo tree -i crypto-bigint -e normal
    # Drop this entry when ssh-key 0.7 leaves release candidate and
    # ssh-agent-lib moves to it.
    "RUSTSEC-2026-0387",

    # --- Build-time only (proc-macro codegen, no runtime path) ------------

    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195 — quick-xml quadratic parsing and
    # unbounded namespace allocation (both DoS). Patched in >=0.41.0, pinned to
    # 0.39.x by wayland-scanner, which we reach only through libcosmic.
    # Reachable exclusively via `wayland-scanner (proc-macro)`: it parses the
    # Wayland protocol XML shipped in the source tree at BUILD time. The input
    # is a fixed local file, not attacker-controlled, and quick-xml is not
    # linked into the runtime binary at all. Revisit on the deliberate
    # libcosmic upgrade already on the roadmap.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # --- Test harness only: not in any shipped binary ---------------------

    # RUSTSEC-2025-0111 — tokio-tar PAX header parsing allows file smuggling.
    # No patched release. Reached only by testcontainers, a dev-dependency of
    # cosmarden-tests; the tarballs it handles are container images we
    # build in CI, not untrusted input. Absent from all shipped binaries.
    "RUSTSEC-2025-0111",

    # RUSTSEC-2026-0118 (NSEC3 unbounded loop, no patch) and RUSTSEC-2026-0119
    # (O(n^2) name compression, patched >=0.26.1 but pinned by
    # hickory-resolver 0.25). hickory only enters the graph because
    # testcontainers turns on reqwest's DNS feature, and Cargo unifies features
    # across the workspace. The shipped binaries resolve DNS through the system
    # resolver — verified:
    #   cargo tree -p cosmarden-agent -e normal -i hickory-proto -> absent
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
]
