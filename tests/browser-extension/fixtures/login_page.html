<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login Test Page</title>
</head>
<body>
    <h1>Login</h1>
    <form id="login-form">
        <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username">
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
        </div>
        <button type="submit">Sign In</button>
    </form>

    <hr>
    <h1>AJAX Login (no navigation)</h1>
    <form id="ajax-form" onsubmit="return false">
        <div>
            <label for="ajax-user">Username</label>
            <input type="text" id="ajax-user" name="login-user">
        </div>
        <div>
            <label for="ajax-password">Password</label>
            <input type="password" id="ajax-password" name="ajax-password">
        </div>
        <button type="submit" id="ajax-submit">Sign In</button>
    </form>

    <hr>
    <h1>Registration (different names)</h1>
    <form id="register-form">
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" name="reg-password">
        </div>
        <button type="submit">Register</button>
    </form>
</body>
</html>
